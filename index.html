<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>나의 레시피 북</title><style>*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;margin:0;background:#fafaf7;color:#111}header{text-align:center;padding:40px 20px 20px}header h1{font-size:32px;margin:0}header p{color:#666;margin-top:8px}.controls{max-width:1100px;margin:0 auto;padding:0 20px 20px;display:flex;gap:10px;flex-wrap:wrap}.controls input,.controls select{padding:10px 14px;border:1px solid #ddd;border-radius:10px;font-size:14px}.controls input{flex:1;min-width:200px}.grid{max-width:1100px;margin:0 auto;padding:0 20px 80px;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}.card{background:white;border-radius:16px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.06);display:flex;flex-direction:column;cursor:pointer;transition:transform .15s,box-shadow .15s}.card:hover{transform:translateY(-4px);box-shadow:0 8px 24px rgba(0,0,0,.12)}.card-cover{height:180px;background:#f1f1ef;background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;font-size:48px}.card-body{padding:16px}.badge{display:inline-block;font-size:12px;padding:4px 8px;border-radius:20px;background:#f0f0f0;margin-right:6px;margin-bottom:6px}.title{font-size:18px;font-weight:700;margin:8px 0;line-height:1.3}.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;align-items:center;justify-content:center;padding:20px}.modal-overlay.open{display:flex}.modal{background:white;border-radius:20px;max-width:720px;width:100%;max-height:90vh;overflow-y:auto;position:relative}.modal-cover{height:260px;background:#eee;background-size:cover;background-position:center}.modal-close{position:absolute;top:12px;right:12px;width:36px;height:36px;border-radius:50%;background:white;border:none;font-size:20px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.15)}.modal-body{padding:24px}.modal-body h2{margin:0 0 12px;font-size:24px}.modal-section{margin-top:20px}.modal-section h3{font-size:16px;margin:0 0 8px;border-left:4px solid #111;padding-left:8px}.modal-section pre{white-space:pre-wrap;font-family:inherit;background:#fafaf7;padding:12px;border-radius:10px;font-size:14px;line-height:1.6}.empty{grid-column:1/-1;text-align:center;padding:60px;color:#999}</style></head><body><header><h1>🍳 나의 레시피 북</h1><p>총 <span id="count">0</span>개 · 카드를 클릭해보세요!</p></header><div class="controls"><input id="search" placeholder="요리명, 재료 검색..."></div><div class="grid" id="grid"></div><div class="modal-overlay" id="modal"><div class="modal"><button class="modal-close" onclick="closeModal()">✕</button><div class="modal-cover" id="mCover"></div><div class="modal-body"><h2 id="mTitle"></h2><div class="modal-section"><h3>🥕 재료</h3><pre id="mIng"></pre></div><div class="modal-section"><h3>👩‍🍳 조리법 & 전체 내용</h3><pre id="mSteps"></pre></div><div style="margin-top:20px"><a id="mNotion" target="_blank" style="color:#666;font-size:13px">Notion에서 열기 →</a></div></div></div></div><script>let data=[];async function load(){try{const res=await fetch('site-data.json?v='+Date.now());data=await res.json();}catch(e){data=[];}render();}function render(){const q=document.getElementById('search').value.toLowerCase();const grid=document.getElementById('grid');let filtered=data.filter(d=>!q||d.title.toLowerCase().includes(q)||(d.ingredients&&d.ingredients.toLowerCase().includes(q))||(d.fullContent&&d.fullContent.toLowerCase().includes(q)));document.getElementById('count').textContent=filtered.length;if(filtered.length===0){grid.innerHTML='<div class=empty>레시피가 없습니다.</div>';return;}grid.innerHTML=filtered.map(r=>{const idx=data.indexOf(r);return `<div class="card" onclick="openModal(${idx})"><div class="card-cover">🍳</div><div class="card-body"><div class="title">${r.title}</div></div></div>`;}).join('');}function openModal(idx){const r=data[idx];document.getElementById('mTitle').textContent=r.title;document.getElementById('mIng').textContent=r.ingredients||'재료 정보 없음';document.getElementById('mSteps').textContent=r.steps||r.fullContent||'조리법 없음';document.getElementById('mNotion').href=r.url;document.getElementById('modal').classList.add('open');}function closeModal(){document.getElementById('modal').classList.remove('open');}document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal();});document.getElementById('search').addEventListener('input',render);load();</script></body></html>
