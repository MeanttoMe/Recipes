<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>나의 레시피 북 - Notion 연동</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Pretendard:wght@400;600&display=swap" rel="stylesheet">
<style>body{font-family:'Pretendard','Gowun Dodum',sans-serif}</style>
</head>
<body class="bg-[#faf8f5]">
<header class="p-6 text-center">
<h1 class="text-4xl font-bold">🍳 나의 레시피 북</h1>
<p class="text-gray-500 mt-2">Notion에서 자동으로 업데이트됩니다</p>
<div id="filters" class="flex flex-wrap gap-2 justify-center mt-6"></div>
</header>
<main class="max-w-6xl mx-auto p-6">
<div id="grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
</main>
<script>
/* INJECT_DATA */
const RECIPES = typeof siteData !== 'undefined' ? siteData : (typeof RECIPES !== 'undefined' ? RECIPES : []);

function render(list){
  const grid = document.getElementById('grid');
  grid.innerHTML = list.map(r=>`
    <div class="bg-white rounded-2xl overflow-hidden shadow-sm hover:shadow-lg transition">
      ${r.thumbnail ? `<img src="${r.thumbnail}" class="w-full h-48 object-cover">` : `<div class="w-full h-48 bg-orange-100 flex items-center justify-center text-4xl">🍳</div>`}
      <div class="p-5">
        <div class="flex gap-2 mb-2">
          ${(r.category||[]).map(c=>`<span class="text-xs bg-orange-100 text-orange-700 px-2 py-1 rounded-full">${c}</span>`).join('')}
          ${r.level?`<span class="text-xs bg-gray-100 px-2 py-1 rounded-full">${r.level}</span>`:''}
        </div>
        <h3 class="font-bold text-lg leading-tight">${r.title||'제목 없음'}</h3>
        <p class="text-sm text-gray-500 mt-1">${r.chef||''} · ${r.time||''}</p>
        ${r.tags?`<div class="flex gap-1 mt-2 flex-wrap">${r.tags.map(t=>`<span class="text-[11px] border px-1.5 py-0.5 rounded">#${t}</span>`).join('')}</div>`:''}
        ${r.ingredients?`<p class="text-sm mt-3 bg-[#faf8f5] p-2 rounded line-clamp-2"><b>재료:</b> ${r.ingredients}</p>`:''}
        ${r.coupang && r.coupang.length ? `<div class="mt-3 space-y-1">${r.coupang.map(p=> p.link ? `<a href="${p.link}" target="_blank" class="block text-xs text-white bg-black rounded-full px-3 py-2 text-center hover:bg-gray-800">🛒 ${p.name||'쿠팡에서 보기'}</a>`:'').join('')}</div>`:''}
      </div>
    </div>
  `).join('');
}

function initFilters(){
  const allCats = [...new Set(RECIPES.flatMap(r=>r.category||[]))];
  const f = document.getElementById('filters');
  f.innerHTML = `<button onclick="render(RECIPES)" class="px-4 py-2 rounded-full bg-black text-white text-sm">전체</button>` + allCats.map(c=>`<button onclick="render(RECIPES.filter(r=>(r.category||[]).includes('${c}')))" class="px-4 py-2 rounded-full bg-white border text-sm hover:bg-orange-50">${c}</button>`).join('');
}

fetch('./site-data.json').then(r=>r.json()).then(data=>{
  window.RECIPES_DATA = data;
  if(data.length) { RECIPES.length=0; data.forEach(d=>RECIPES.push(d)); }
  initFilters(); render(RECIPES);
}).catch(()=>{
  initFilters(); render(RECIPES);
});
</script>
</body>
</html>
