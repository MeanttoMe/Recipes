name: Notion to GitHub Pages

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write
  pages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Fetch Notion Database
        env:
          NOTION_API_KEY: ${{secrets.NOTION_API_KEY}}
          NOTION_DB_ID: 3f25d923b2e880b7b212ecedb7781637
        run: |
          curl -s -X POST "https://api.notion.com/v1/databases/$NOTION_DB_ID/query" \
            -H "Authorization: Bearer $NOTION_API_KEY" \
            -H "Notion-Version: 2022-06-28" \
            -H "Content-Type: application/json" \
            -d '{"page_size": 100}' -o recipes.json
          cat recipes.json | head -c 500
          node build.js

      - name: Configure git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Deploy to Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{secrets.GITHUB_TOKEN}}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
