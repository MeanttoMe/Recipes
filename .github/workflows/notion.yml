name: Notion to GitHub Pages

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch Notion Database
        env:
          NOTION_API_KEY: ${{secrets.NOTION_API_KEY}}
          NOTION_DB_ID: 3f25d923b2e880b7b212ecedb7781637
        run: |
          echo "Fetching Notion DB $NOTION_DB_ID"
          curl -s -X POST "https://api.notion.com/v1/databases/$NOTION_DB_ID/query" \
            -H "Authorization: Bearer $NOTION_API_KEY" \
            -H "Notion-Version: 2022-06-28" \
            -H "Content-Type: application/json" \
            -d '{"page_size": 100}' -o recipes.json
          echo "Fetched $(cat recipes.json | wc -c) bytes"
          node build.js
      - name: Deploy to Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{secrets.GITHUB_TOKEN}}
          publish_dir: ./dist
          publish_branch: gh-pages
