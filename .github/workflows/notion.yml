name: Notion to 【entity-GitHub¦canonical_name=GitHub】 Pages
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Notion Database + Page Contents
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DB_ID: ${{ secrets.NOTION_DB_ID }}
        run: |
          echo "Fetching database..."
          curl -s -X POST "https://api.notion.com/v1/databases/$NOTION_DB_ID/query" \
            -H "Authorization: Bearer $NOTION_API_KEY" \
            -H "Notion-Version: 2022-06-28" \
            -H "Content-Type: application/json" \
            --data '{"page_size": 100}' -o recipes.json

          echo "Fetching page contents..."
          node scripts/fetch-notion.js
          ls -lh recipes.json

      - name: Build site
        run: node build.js

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir:./dist
