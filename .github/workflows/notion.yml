
name: Notion to GitHub Pages
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Fetch Notion Database + Page Contents
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DB_ID: ${{ secrets.NOTION_DB_ID }}
        run: |
          echo "Fetching database..."
          curl -s -X POST "https://api.notion.com/v1/databases/$NOTION_DB_ID/query"             -H "Authorization: Bearer $NOTION_API_KEY"             -H "Notion-Version: 2022-06-28"             -H "Content-Type: application/json"             --data '{"page_size": 100}' -o recipes.json

          echo "Fetching each page content..."
          node << 'NODEJS'
          const fs=require('fs');
          const https=require('https');
          const data=JSON.parse(fs.readFileSync('recipes.json','utf8'));
          const token=process.env.NOTION_API_KEY;
          
          function fetchBlocks(id){
            return new Promise((resolve)=>{
              const req=https.request({
                hostname:'api.notion.com',
                path:`/v1/blocks/${id}/children?page_size=100`,
                method:'GET',
                headers:{'Authorization':'Bearer '+token,'Notion-Version':'2022-06-28'}
              }, res=>{
                let body=''; res.on('data',d=>body+=d);
                res.on('end',()=>{
                  try{ resolve(JSON.parse(body)); }catch(e){ resolve({results:[]}); }
                });
              });
              req.on('error',()=>resolve({results:[]}));
              req.end();
            });
          }
          
          function blockToText(block){
            const t = block[block.type];
            if(!t || !t.rich_text) return '';
            return t.rich_text.map(x=>x.plain_text).join('');
          }
          
          (async()=>{
            for(const page of data.results){
              console.log('Fetching content for', page.id);
              const blocks=await fetchBlocks(page.id);
              let text='';
              for(const b of blocks.results||[]){
                if(['paragraph','heading_1','heading_2','heading_3','bulleted_list_item','numbered_list_item','to_do','quote','callout'].includes(b.type)){
                  const txt = blockToText(b);
                  if(!txt) continue;
                  if(b.type==='heading_1') text += '\n# ' + txt + '\n';
                  else if(b.type==='heading_2') text += '\n## ' + txt + '\n';
                  else if(b.type==='heading_3') text += '\n### ' + txt + '\n';
                  else if(b.type==='bulleted_list_item') text += '- ' + txt + '\n';
                  else if(b.type==='numbered_list_item') text += '1. ' + txt + '\n';
                  else text += txt + '\n\n';
                }
              }
              page._pageContent = text;
              console.log('  -> content length', text.length);
            }
            fs.writeFileSync('recipes.json', JSON.stringify(data));
            console.log('Saved recipes.json with page contents');
          })();
          NODEJS
          
          # Wait for async node to finish (need to run with delay)
          sleep 8
          ls -lh recipes.json
          cat recipes.json | head -c 2000

      - name: Build site
        run: |
          node build.js

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
